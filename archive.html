<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANCIVE — ARCHIVE</title>
  <style>html,body{background:#1a1816}body{opacity:0}</style>
  <link rel="stylesheet" href="archive-style.css">
</head>
<body>

  <div class="ar-scale-container">
    <div class="ar-wrapper">

      <!-- CENTER LINE -->
      <div class="ar-el" id="ar_center_line"></div>

      <!-- LEFT — SCATTERED YEAR DIGITS -->
      <div class="ar-el ar-digit" id="ar_digit_2a">2</div>
      <div class="ar-el ar-digit" id="ar_digit_0">0</div>
      <div class="ar-el ar-digit" id="ar_digit_2b">2</div>
      <div class="ar-el ar-digit" id="ar_digit_6">6</div>

      <!-- LEFT — OBJECT SCATTER -->
      <img class="ar-el ar-obj" id="ar_obj1" src="assets/images/archive/archive_obj1.png" alt="">
      <img class="ar-el ar-obj" id="ar_obj2" src="assets/images/archive/archive_obj2.png" alt="">

      <!-- LEFT LABELS -->
      <div class="ar-el ar-text ar-section-label" id="ar_seasons_label">SEASONS</div>

      <!-- HEADER -->
      <a class="ar-el" id="ar_brand_logo" href="index.html"><img src="assets/images/left_logo.png" alt="FANCIVE"></a>
      <div class="ar-el ar-text" id="ar_page_title">ARCHIVE</div>
      <div class="ar-el ar-text" id="ar_page_year">2026</div>
      <nav class="ar-el ar-text" id="ar_menu_group">
        <span id="ar_menu_collection">COLLECTION</span>
        <span id="ar_menu_about">ABOUT</span>
        <span>CONTACT</span>
      </nav>

      <!-- RIGHT PANEL — INDEX LABEL -->
      <div class="ar-el ar-text ar-section-label" id="ar_index_label">INDEX</div>

      <!-- RIGHT PANEL — COLOPHON -->
      <div class="ar-el" id="ar_colophon_rule"></div>
      <div class="ar-el ar-text" id="ar_colophon">FANCIVE ARCHIVE — ONGOING</div>

      <!-- RIGHT PANEL — SEASON LIST -->
      <div class="ar-el" id="ar_season_list">

        <div class="ar-rule"></div>

        <div class="ar-season ar-season--active" id="ar_season01">
          <span class="ar-season-no">01</span>
          <span class="ar-season-name">S/S 2026</span>
          <span class="ar-season-status">7 LOOKS</span>
          <span class="ar-season-arrow">→</span>
        </div>

        <div class="ar-rule"></div>

        <div class="ar-season ar-season--dim">
          <span class="ar-season-no">02</span>
          <span class="ar-season-name">A/W 2025</span>
          <span class="ar-season-status">FORTHCOMING</span>
        </div>

        <div class="ar-rule"></div>

        <div class="ar-season ar-season--muted">
          <span class="ar-season-no">03</span>
          <span class="ar-season-name">S/S 2025</span>
          <span class="ar-season-status">—</span>
        </div>

        <div class="ar-rule"></div>

        <div class="ar-season ar-season--muted">
          <span class="ar-season-no">04</span>
          <span class="ar-season-name">A/W 2024</span>
          <span class="ar-season-status">—</span>
        </div>

        <div class="ar-rule"></div>

      </div>

    </div>
  </div>

  <script src="archive.js"></script>
</body>
</html>
