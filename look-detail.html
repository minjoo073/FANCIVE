<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANCIVE — LOOK</title>
  <link rel="stylesheet" href="look-detail-style.css">
</head>
<body>
  <div class="ld-scale-container">
    <div class="ld-wrapper">

      <!-- GHOST LOOK NUMBER -->
      <div id="ld_ghost_num"></div>

      <!-- LOOK SLIDES (built by JS) -->
      <div id="ld_slides"></div>

      <!-- HEADER -->
      <header id="ld_header">
        <a id="ld_logo" href="collection.html">
          <img src="assets/images/left_logo.png" alt="FANCIVE">
        </a>
        <div id="ld_look_label"></div>
      </header>

      <!-- RIGHT NAV MENU -->
      <nav id="ld_nav_menu">
        <a id="ld_nav_about" href="about.html">ABOUT</a>
        <a id="ld_nav_archive" href="archive.html">ARCHIVE</a>
        <span>CONTACT</span>
      </nav>

      <!-- LOOK DESCRIPTION (bottom left) -->
      <div id="ld_desc_layer"></div>

      <!-- LOOK INDEX (bottom) -->
      <nav id="ld_look_index">
        <span class="ld-idx" data-look="1">01</span>
        <span class="ld-idx" data-look="2">02</span>
        <span class="ld-idx" data-look="3">03</span>
        <span class="ld-idx" data-look="4">04</span>
        <span class="ld-idx" data-look="5">05</span>
        <span class="ld-idx" data-look="6">06</span>
        <span class="ld-idx" data-look="7">07</span>
      </nav>

    </div>
  </div>
  <script src="look-detail.js"></script>
</body>
</html>
