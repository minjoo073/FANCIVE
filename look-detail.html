<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FANCIVE — LOOK</title>
  <link rel="stylesheet" href="look-detail-style.css">
</head>
<body>
  <div class="ld-scale-container">
    <div class="ld-wrapper">

      <!-- GHOST LOOK NUMBER -->
      <div id="ld_ghost_num"></div>

      <!-- LOOK SLIDES (built by JS) -->
      <div id="ld_slides"></div>

      <!-- HEADER -->
      <header id="ld_header">
        <a id="ld_logo" href="collection.html">
          <img src="assets/images/left_logo.webp" alt="FANCIVE">
        </a>
        <div id="ld_look_label">
          <span id="ld_look_num"></span><span id="ld_look_sep"> · </span><span id="ld_look_season">SS 2026</span>
        </div>
      </header>

      <!-- RIGHT NAV MENU -->
      <nav id="ld_nav_menu">
        <div class="menu-burger"><i></i><i></i><i></i></div>
        <div class="menu-items">
          <a id="ld_nav_about" href="about.html">ABOUT</a>
          <a id="ld_nav_archive" href="archive.html">ARCHIVE</a>
          <span>CONTACT</span>
        </div>
      </nav>

      <!-- LOOK DESCRIPTION (bottom left) -->
      <div id="ld_desc_layer"></div>

      <!-- LOOK INDEX (bottom) -->
      <div id="ld_look_index">
        <span id="ld_idx_current">01</span>
        <div id="ld_idx_track">
          <div id="ld_idx_fill"></div>
        </div>
        <span id="ld_idx_total">07</span>
      </div>

    </div>
  </div>
  <script src="look-detail.js"></script>
</body>
</html>
